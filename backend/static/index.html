<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trình dựng video review phim AI</title>
<style>
:root{--bg:#101318;--p1:#171b22;--p2:#1e242d;--p3:#283140;--bd:#2c3441;--tx:#e6e9ee;--mut:#8b95a3;--ac:#4c7dff;--ac2:#3a62d6;--ok:#3fc79a;--er:#ff7b72;--wa:#e3b341}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:13px/1.45 system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:6px 9px;min-width:0}
button{cursor:pointer}button:hover{background:var(--p3)}button:disabled{opacity:.45;cursor:default}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.p:hover{background:var(--ac2)}
button.d{color:var(--er)}button.big{padding:10px 12px;width:100%;font-weight:600}
input[type=range]{padding:0;height:18px;accent-color:var(--ac);background:none;border:0}input[type=color]{padding:1px;height:30px;width:100%}
textarea{width:100%;resize:vertical}label{display:block;color:var(--mut);font-size:12px}label>input,label>select{margin-top:3px;width:100%;color:var(--tx)}
h3{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}h3:first-child{margin-top:0}
hr{border:0;border-top:1px solid var(--bd);margin:14px 0}small{color:var(--mut);display:block}.mut{color:var(--mut)}.err{color:var(--er)}.ok{color:var(--ok)}
[hidden]{display:none!important}
/* màn hình đăng nhập */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1a2233,#0d1015);z-index:50}
#gate .box{width:440px;max-width:92vw;background:var(--p1);border:1px solid var(--bd);border-radius:14px;padding:28px;display:grid;gap:12px}
#gate h1{margin:0;font-size:20px}#gate p{margin:0;color:var(--mut)}#gate details{color:var(--mut)}#gate details input{margin-top:8px;width:100%}#gMsg{white-space:pre-wrap;word-break:break-word;max-height:38vh;overflow:auto;font-size:12px}
#gate .lock{font-size:34px;text-align:center}#gate h1{text-align:center}#gate p{text-align:center}
#updBadge{cursor:pointer;border-radius:20px;padding:3px 10px;font-size:12px;background:#7c3aed;color:#fff;white-space:nowrap}
.upd{border:1px solid var(--bd);border-radius:8px;padding:10px;display:grid;gap:6px}.upd pre{white-space:pre-wrap;max-height:160px;overflow:auto;font-size:11px;margin:0;color:var(--mut)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#credit{cursor:pointer;border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:12px;white-space:nowrap}#credit.low{color:var(--er);border-color:var(--er)}
/* chat AI */
.chat{display:flex;flex-direction:column;height:100%;gap:8px}
.chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:120px}
.msg{padding:8px 10px;border-radius:10px;max-width:92%;white-space:pre-wrap;word-break:break-word;line-height:1.4}
.msg.u{align-self:flex-end;background:var(--ac2);color:#fff}.msg.a{align-self:flex-start;background:var(--p2);border:1px solid var(--bd)}
.msg small{margin-top:4px}.msg.wait{opacity:.7;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{font-size:11px;padding:3px 8px;border-radius:99px}
.chatin{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}.chatin textarea{resize:none;min-height:38px;max-height:120px}
#rbody.chatmode{display:flex;flex-direction:column}#rbody.chatmode>.chat{flex:1;min-height:0}
.ready{display:grid;gap:4px;margin-bottom:8px}.ready div{display:grid;grid-template-columns:22px 1fr;gap:4px;font-size:12px}.ready small{grid-column:2}
.st-ok{color:var(--ok)}.st-ai{color:#b48cff}.st-user{color:var(--wa)}.st-optional{color:var(--mut)}
.disk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px}.disk span:nth-child(even){text-align:right;color:var(--tx)}
#apiState{cursor:pointer;border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:12px}#apiState.ok{color:var(--ok)}#apiState.err{color:var(--wa)}
/* khung chính */
#app{height:100%;display:grid;grid-template-rows:46px 1fr 26px}
#sysbar{display:flex;gap:8px;align-items:center;padding:0 12px;border-top:1px solid var(--bd);background:#0b0d11;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;cursor:pointer}
#sysbar b{color:var(--tx);font-weight:500}#sysbar .hot{color:var(--wa)}#sysbar .crit{color:var(--er)}#sysbar .gpu{color:var(--ok)}
.keyrow{display:grid;grid-template-columns:1fr auto;gap:6px}.keyrow input{font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em}
#gTabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
#gTabs button{border:0;border-radius:0;padding:9px;background:transparent;color:var(--mut);font-weight:600}#gTabs button.on{background:var(--ac);color:#fff}
.gpane{display:grid;gap:10px}.gcode{font:600 22px ui-monospace,Consolas,monospace;letter-spacing:.18em;text-align:center;text-transform:uppercase}
.glink{background:none;border:0;padding:0;color:var(--ac);cursor:pointer;font-size:12px;text-align:left}
#licChip{border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}#licChip.warn{color:var(--wa);border-color:var(--wa)}
.flist{display:grid;gap:3px;max-height:260px;overflow:auto;margin:6px 0}.flist label{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:12px}
.flist small{white-space:nowrap}.hwgrid{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}.hwgrid span:nth-child(odd){color:var(--mut)}
#top{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--p1);border-bottom:1px solid var(--bd)}
#top .brand{font-weight:700}#top .grow{flex:1;text-align:center;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shell{display:grid;grid-template-columns:330px minmax(0,1fr) 340px;min-height:0}
@media (max-width:1300px){#shell{grid-template-columns:280px minmax(0,1fr) 300px}#top{gap:8px}#transport{gap:6px}}
aside,#center{min-height:0;min-width:0}
#left{background:var(--p1);border-right:1px solid var(--bd);display:flex;flex-direction:column}
#right{background:var(--p1);border-left:1px solid var(--bd);display:flex;flex-direction:column}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-bottom:1px solid var(--bd)}
#menu button{display:flex;gap:7px;align-items:center;justify-content:flex-start;padding:7px 9px;background:transparent;border-color:transparent}
#menu button.on{background:var(--p3);border-color:var(--ac)}
#lbody,#rbody{overflow:auto;padding:12px;flex:1;min-height:0}
#rtabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--bd)}
#rtabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:7px 8px}
#rtabs button.on{border-bottom-color:var(--ac);color:#fff}
.form{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.item,.asset{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;background:var(--p2)}
.item{cursor:pointer;display:block}.item.on{border-color:var(--ac)}.item b,.asset b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asset>div{min-width:0}
button.x{padding:2px 8px;flex:none}.chk{display:flex;gap:6px;align-items:center;margin-top:8px}.chk input{width:auto;margin:0}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:22px 10px;text-align:center;cursor:pointer;color:var(--mut)}.drop.over{border-color:var(--ac);background:var(--p2)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:11px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac)}
.dirty{background:#3a2f12;border:1px solid var(--wa);border-radius:8px;padding:8px;margin-bottom:10px;display:grid;gap:6px}
.cuebox{background:var(--p2);border-radius:8px;padding:8px;margin-bottom:10px}
.sl{display:grid;grid-template-columns:1fr 46px;gap:6px;align-items:center}.sl output{text-align:right;color:var(--tx)}
.cue{display:grid;grid-template-columns:54px 54px 1fr;gap:4px;margin-bottom:4px}.cue input{padding:3px 5px;font-size:12px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pos button.on{border-color:var(--ac);background:var(--p3)}
/* giữa: xem video + timeline */
#center{display:grid;grid-template-rows:minmax(0,1fr) 44px 250px;background:#0b0d11}
#stageWrap{display:flex;align-items:center;justify-content:center;min-height:0;padding:10px;overflow:hidden}
#stage{position:relative;background:#000;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px var(--bd)}
#pv,#pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
#pimg{display:none}#psub{position:absolute;left:5%;right:5%;text-align:center;font-weight:700;pointer-events:none;white-space:pre-wrap;line-height:1.25}
#plogo{position:absolute;display:none;pointer-events:none}
#pempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);background:#0b0d11}
#transport{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--p1);border-top:1px solid var(--bd)}
#transport .grow{flex:1}#transport .seg button{padding:5px 10px}#transport .seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#transport input[type=range]{width:110px}
#tl{display:grid;grid-template-columns:86px minmax(0,1fr);background:var(--p1);border-top:1px solid var(--bd);min-height:0}
#tllabels{border-right:1px solid var(--bd);padding-top:22px}#tllabels div{color:var(--mut);font-size:11px;padding:0 8px;display:flex;align-items:center;border-bottom:1px solid #222a35}
#tlscroll{overflow:auto;position:relative;min-width:0}#tlinner{position:relative;min-height:100%}
#ruler{height:22px;position:relative;border-bottom:1px solid var(--bd)}#ruler i{position:absolute;top:4px;font-style:normal;font-size:10px;color:var(--mut);padding-left:3px;border-left:1px solid var(--bd);height:18px}
.trk{position:relative;border-bottom:1px solid #222a35}.hint{color:var(--mut);padding:5px 8px;font-size:11px}
.blk{position:absolute;top:2px;bottom:2px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10px;padding:2px 4px;border:1px solid rgba(255,255,255,.12)}
.blk.voice{background:repeating-linear-gradient(90deg,#2a5a4a 0 3px,#2f6b58 3px 6px)}.blk.sub{background:#2b3a57}
.blk.vid{background:#34405a;cursor:pointer;padding:0}.blk.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.blk.vid span{position:absolute;left:3px;bottom:2px;right:3px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}.blk.vid.sel{outline:2px solid var(--ac);z-index:2}
.blk.fx{background:#4a3a5e}.blk.mus{background:#5a4a2a}.blk.logo{background:#2a4a5a}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--er);pointer-events:none;z-index:5}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;overflow:auto;max-height:60vh;padding-top:8px}
.sgrid div{background:var(--p2);border:1px solid var(--bd);border-radius:6px;cursor:pointer;font-size:11px;padding-bottom:4px}.sgrid div:hover{border-color:var(--ac)}.sgrid img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:6px 6px 0 0;background:#000}.sgrid span{padding:0 6px;display:block}
dialog{background:var(--p1);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(760px,92vw)}dialog::backdrop{background:#000a}.dh{display:flex;gap:10px;align-items:center}.dh b{flex:1}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:8px;z-index:90}.toast{background:var(--p3);border:1px solid var(--bd);border-left:4px solid var(--ac);padding:9px 12px;border-radius:8px;max-width:360px}.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--er)}
</style>
</head>
<body>

<div id="gate" hidden>
 <form class="box" id="gForm" autocomplete="off" onsubmit="return false">
  <div class="lock">🔒</div>
  <h1>Movie Review Editor</h1>
  <!-- CHẾ ĐỘ TÀI KHOẢN -->
  <div id="accBox" class="gpane" hidden>
   <div id="gTabs"><button type="button" data-gtab="login">Đăng nhập</button><button type="button" data-gtab="register">Đăng ký</button></div>
   <div id="gLogin" class="gpane">
    <label>Tên đăng nhập<input id="aUser" autocomplete="username" spellcheck="false"></label>
    <label>Mật khẩu<input id="aPw" type="password" autocomplete="current-password"></label>
    <button class="p big" id="aLoginBtn" type="submit">Đăng nhập</button>
    <button type="button" class="glink" id="aForgot">Quên mật khẩu?</button>
   </div>
   <div id="gReg" class="gpane" hidden>
    <label>Tên đăng nhập <span class="mut">(3–32 ký tự: chữ không dấu, số, . _ -)</span><input id="rUser" spellcheck="false" maxlength="32"></label>
    <label>Mật khẩu <span class="mut">(≥ 6 ký tự)</span><input id="rPw" type="password" autocomplete="new-password"></label>
    <label>Nhập lại mật khẩu<input id="rPw2" type="password" autocomplete="new-password"></label>
    <label>Họ tên<input id="rName" maxlength="80"></label>
    <label>Số điện thoại / Zalo <span class="mut">(để Admin gửi mã kích hoạt)</span><input id="rPhone" maxlength="30"></label>
    <button class="p big" id="rBtn" type="button">📨 Đăng ký & gửi yêu cầu cho Admin</button>
   </div>
   <div id="gPend" class="gpane" hidden>
    <p id="pMsg"></p>
    <div class="hwgrid"><span>Tài khoản</span><span><b id="pUser"></b></span><span>Mã máy</span><span><b id="pMk" style="font-family:Consolas,monospace"></b> <button type="button" class="glink" id="pCopy">sao chép</button></span></div>
    <label>Mã kích hoạt Admin gửi cho bạn<input id="pCode" class="gcode" maxlength="400" placeholder="XXXX-XXXX" spellcheck="false"></label>
    <button class="p big" id="pBtn" type="button">✓ Kích hoạt máy này</button>
    <div class="row" style="margin:0;justify-content:space-between"><button type="button" id="pCheck">↻ Kiểm tra lại</button><button type="button" class="glink" id="pOther">Đăng nhập tài khoản khác</button></div>
   </div>
   <details><summary class="mut">Địa chỉ máy chủ Admin</summary><div class="keyrow" style="margin-top:6px"><input id="lSrv" placeholder="vd: http://107.167.71.19:8800"><button type="button" id="lSrvSave">Lưu</button></div></details>
  </div>
  <!-- CHẾ ĐỘ CỤC BỘ (bản không gắn giấy phép) -->
  <div id="pwBox" class="gpane" hidden>
   <p id="gHint">Nhập mật khẩu để vào ứng dụng.</p>
   <label>Key (mã máy — tự điền)<div class="keyrow"><input id="gKey" readonly tabindex="-1"><button type="button" data-copykey="#gKey" title="Sao chép">⧉</button></div></label>
   <label>Mật khẩu<input id="gPw" type="password" autocomplete="off"></label>
   <label id="gPw2Wrap" hidden>Nhập lại mật khẩu<input id="gPw2" type="password" autocomplete="off"></label>
   <button class="p big" id="gGo" type="submit">Đăng nhập</button>
   <button type="button" class="glink" id="gForgot">Quên mật khẩu?</button>
  </div>
  <label class="chk" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="gShow" style="width:auto;margin:0">Hiện mật khẩu</label>
  <div id="gMsg" class="mut"></div>
  <small id="gFoot"></small>
 </form>
</div>

<div id="app" hidden>
 <header id="top">
  <span class="brand">🎬 Dựng review AI</span><span id="ver" class="mut"></span>
  <span id="projName" class="mut"></span>
  <span class="grow" id="topStatus"></span>
  <button class="p" data-act="auto">⚡ Tự động tạo video</button>
  <button data-act="menu" data-k="export">📤 Xuất video</button>
  <button data-act="openChat" title="Chat với AI để tự động edit theo câu lệnh">💬 Chat AI</button>
  <span id="apiState" data-act="menu" data-k="settings" title="Kết nối API (bấm để mở Cài đặt)">○ Chưa kết nối API</span>
  <span id="updBadge" data-act="openUpdate" hidden title="Có phiên bản mới — bấm để cập nhật"></span>
  <span id="licChip" data-act="openLicense" hidden></span>
  <span id="credit" data-act="menu" data-k="settings" hidden title="Tín dụng API còn lại"></span>
  <span id="conn" class="ok">● Đã kết nối</span>
  <button data-act="lock" title="Khoá ứng dụng (đăng xuất)">🔒 Khoá</button>
 </header>
 <div id="shell">
  <aside id="left"><nav id="menu"></nav><div id="lbody"></div></aside>

  <section id="center">
   <div id="stageWrap"><div id="stage">
     <video id="pv" playsinline muted preload="auto"></video><img id="pimg" alt="">
     <div id="psub"></div><img id="plogo" alt=""><div id="pempty"></div>
   </div></div>
   <div id="transport">
     <button id="bPlay" data-act="play" title="Phát / tạm dừng (Space)">▶</button>
     <span id="tcur">0:00 / 0:00</span>
     <input id="scrub" type="range" min="0" max="1000" value="0" class="grow">
     <span class="seg"><button id="mLive" data-act="mode" data-m="live" class="on">Xem nhanh</button><button id="mExp" data-act="mode" data-m="export">Video đã xuất</button></span>
     <label style="display:flex;gap:6px;align-items:center">Thu phóng<input id="tzoom" type="range" min="2" max="40" value="8"></label>
   </div>
   <div id="tl">
     <div id="tllabels"><div style="height:28px">Giọng đọc</div><div style="height:28px">Phụ đề</div><div style="height:58px">Cảnh phim</div><div style="height:26px">Hiệu ứng</div><div style="height:26px">Nhạc nền</div><div style="height:26px">Logo</div></div>
     <div id="tlscroll"><div id="tlinner">
       <div id="ruler"></div>
       <div class="trk" id="t-voice" style="height:28px"></div><div class="trk" id="t-sub" style="height:28px"></div>
       <div class="trk" id="t-vid" style="height:58px"></div><div class="trk" id="t-fx" style="height:26px"></div>
       <div class="trk" id="t-mus" style="height:26px"></div><div class="trk" id="t-logo" style="height:26px"></div>
       <div id="playhead"></div>
     </div></div>
   </div>
  </section>

  <aside id="right"><div id="rtabs"></div><div id="rbody"></div></aside>
 </div>
</div>

<audio id="pa" preload="auto"></audio>
<dialog id="sceneDlg"><div class="dh"><b>Chọn cảnh khác</b><select id="sdFoot" style="max-width:240px"></select><button data-act="closeScene">Đóng</button></div><div id="sdGrid" class="sgrid"></div></dialog>
<div id="toasts"></div>

<script>
/* ================= Tiện ích ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,+s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
const fmt1=s=>{s=Math.max(0,+s||0);return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0')};
function toast(msg,kind){const d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),kind==='err'?7500:3500)}
function errText(t){try{const j=JSON.parse(t);return typeof j.detail==='string'?j.detail:JSON.stringify(j.detail)}catch{return t||'Lỗi không xác định'}}
async function pingHealth(ms){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);const r=await fetch('/api/health',{signal:c.signal,cache:'no-store'});clearTimeout(t);return r.ok}catch{return false}}
async function netError(e){
  if(e&&e.name==='AbortError')return 'Quá thời gian chờ phản hồi. Máy chủ relay có thể đang chậm hoặc chặn kết nối — xem phần "Chi tiết" hoặc thử lại.';
  return (await pingHealth(3000))

async function api(path,opt={},timeoutMs=0){
  if(LOCKED&&!/^\/(auth|license)\//.test(path))throw new Error('Ứng dụng đang khoá — hãy đăng nhập');
  let timer;
  if(timeoutMs){const ctl=new AbortController();opt={...opt,signal:ctl.signal};timer=setTimeout(()=>ctl.abort(),timeoutMs)}
  let r;
  try{r=await fetch('/api'+path,opt)}catch(e){clearTimeout(timer);throw new Error(await netError(e))}
  clearTimeout(timer);
  if(r.status===401&&!path.startsWith('/auth/')){showLogin('Phiên đăng nhập đã hết. Hãy đăng nhập lại.');throw new Error('Cần đăng nhập')}
  if(r.status===402&&!path.startsWith('/license/')){const t=errText(await r.text());try{AUTH=await api('/auth/status')}catch{}routeAuth(t);throw new Error(t)}
  if(!r.ok)throw new Error(errText(await r.text()));
  return r.status===204?null:r.json();
}

function computeClips(plan,voiceDur){
  const secs=(plan&&plan.sections)||[],clips=[];
  secs.forEach((s,k)=>{
    const t0=k===0?0:+s.voice_start,t1=k+1<secs.length?+secs[k+1].voice_start:Math.max(+s.voice_end,voiceDur||0);
    const vis=s.visuals||[],w=vis.map(v=>(v.end-v.start)/(v.speed||1)),tw=w.reduce((a,b)=>a+b,0)||1;let cum=0;
    vis.forEach((v,j)=>{const a=t0+(t1-t0)*cum/tw;cum+=w[j];clips.push({t0:a,t1:t0+(t1-t0)*cum/tw,k,j});});
  });
  return clips;
}
function voiceDur(){return (S.voice&&S.voice.duration_seconds)||(S.cues.length?S.cues[S.cues.length-1].end_seconds:0)}
function buildClips(){
  S.clips=computeClips(S.plan,voiceDur()).map(c=>({...c,v:S.plan.sections[c.k].visuals[c.j],s:S.plan.sections[c.k]}));
  S.T=S.clips.length?S.clips[S.clips.length-1].t1:voiceDur();
}

  if(c.budget)return `còn ~${usd(c.budget.remaining_usd)} / hạn mức ${usd(c.budget.limit_usd)}`;
  return `đã dùng ~${usd(u.usd)} (ước tính)`;

function guessType(f){
  const n=f.name.toLowerCase(),ext=n.split('.').pop();
  if(['mp4','mov','mkv','webm'].includes(ext))return 'footage';
  if(['mp3','wav','m4a'].includes(ext))return /nhac|nhạc|music|bgm|beat|song/.test(n)?'music':'voice';
  if(['png','jpg','jpeg','webp'].includes(ext))return 'logo';
  if(ext==='cube')return 'lut';
  if(['srt','vtt'].includes(ext))return 'script';
  return null;
}

    x.upload.onprogress=e=>{if(e.lengthComputable)onp(e.loaded/e.total)};
    x.onload=()=>x.status<300?res(JSON.parse(x.responseText)):rej(new Error(errText(x.responseText)));
    x.onerror=()=>rej(new Error('Lỗi mạng khi tải file'));
    const fd=new FormData();fd.append('asset_type',type);fd.append('description','');fd.append('file',file);x.send(fd);

/* ================= Timeline ================= */
function renderTimeline(){
  const px=S.px,T=Math.max(S.T,10),W=Math.ceil(T*px)+60;
  $('#tlinner').style.width=W+'px';
  const step=px>=24?1:px>=12?2:px>=6?5:px>=3?10:30;let rul='';for(let t=0;t<=T;t+=step)rul+=`<i style="left:${t*px}px">${fmt(t)}</i>`;$('#ruler').innerHTML=rul;
  $('#t-voice').innerHTML=S.voice?`<div class="blk voice" style="left:0;width:${(S.voice.duration_seconds||T)*px}px">${esc(S.voice.file_name)}</div>`:'<div class="hint">Chưa có voice-over</div>';
  $('#t-sub').innerHTML=S.cues.length?S.cues.map(c=>`<div class="blk sub" style="left:${c.start_seconds*px}px;width:${Math.max(2,(c.end_seconds-c.start_seconds)*px-1)}px" title="${esc(c.text)}">${esc(c.text)}</div>`).join(''):'<div class="hint">Chưa có phụ đề</div>';
  $('#t-vid').innerHTML=S.clips.length?S.clips.map((c,i)=>{
    const th=fa(c.v.footage)?`<img loading="lazy" draggable="false" src="/api/projects/${S.pid}/frame?footage=${encodeURIComponent(c.v.footage)}&t=${(+c.v.start+0.3).toFixed(1)}" alt="">`:'';
    const sel=S.sel&&S.sel.k===c.k&&S.sel.j===c.j?' sel':'';
    return `<div class="blk vid${sel}" draggable="true" data-clip-i="${i}" data-act="selClip" data-i="${i}" style="left:${c.t0*px}px;width:${Math.max(3,(c.t1-c.t0)*px-1)}px" title="${esc(c.v.footage)} ${(+c.v.start).toFixed(1)}–${(+c.v.end).toFixed(1)}s">${th}<span>${c.k+1}</span></div>`}).join(''):'<div class="hint">Chưa có bản dựng — bấm “Tự động tạo video”</div>';
  $('#t-fx').innerHTML=S.clips.map(c=>{const tags=[c.v.filter&&(FILTER_VN[c.v.filter]||c.v.filter),c.v.transition_in&&c.v.transition_in!=='none'&&TRANS[c.v.transition_in],(c.v.zoom_end||1)>(c.v.zoom_start||1)+.01&&'zoom'].filter(Boolean);
    return tags.length?`<div class="blk fx" style="left:${c.t0*px}px;width:${Math.max(3,(c.t1-c.t0)*px-1)}px">${esc(tags.join(' · '))}</div>`:''}).join('');
  $('#t-mus').innerHTML=S.music?`<div class="blk mus" style="left:0;width:${T*px}px">${esc(S.music.file_name)} · ${Math.round(S.opts.music_volume*100)}%</div>`:'<div class="hint">Chưa có nhạc nền</div>';
  $('#t-logo').innerHTML=S.logo?`<div class="blk logo" style="left:0;width:${T*px}px">${esc(S.logo.file_name)}</div>`:'<div class="hint">Chưa có logo</div>';
  setPlayhead(nowT());
}
function setPlayhead(t){
  $('#playhead').style.left=(t*S.px)+'px';
  if(S.playing){const sc=$('#tlscroll'),x=t*S.px;if(x<sc.scrollLeft||x>sc.scrollLeft+sc.clientWidth-40)sc.scrollLeft=Math.max(0,x-sc.clientWidth/3)}
}
$('#tlscroll').addEventListener('click',e=>{
  if(e.target.closest('[data-act=selClip]'))return;
  const r=$('#tlscroll').getBoundingClientRect();seek((e.clientX-r.left+$('#tlscroll').scrollLeft)/S.px);
});
$('#tzoom').oninput=e=>{S.px=+e.target.value;renderTimeline()};

/* ================= Trình xem trước ================= */
const pv=$('#pv'),pa=$('#pa'),pimg=$('#pimg'),psub=$('#psub'),plogo=$('#plogo');
let raf=0,curClip=-2,clockBase=0,clockStart=0,clockOn=false,curSrc='';
function nowT(){if(S.mode==='export')return pv.currentTime||0;if(S.voice)return pa.currentTime||0;return clockOn?clockBase+(performance.now()-clockStart)/1000:clockBase}
function fitStage(){
  const w=$('#stageWrap'),W=w.clientWidth-20,H=w.clientHeight-20,r=S.opts.aspect_ratio==='9:16'?9/16:16/9;
  if(W<=0||H<=0)return;let sw=W,sh=W/r;if(sh>H){sh=H;sw=H*r}
  const st=$('#stage');st.style.width=sw+'px';st.style.height=sh+'px';applyOptsToStage();
}
function applyOptsToStage(){
  const st=$('#stage'),sw=st.clientWidth,sh=st.clientHeight,o=S.opts,m=Math.min(sw,sh)/1080,out=o.aspect_ratio==='9:16'?1080:1920;
  psub.style.fontSize=Math.max(8,o.subtitle_size*m)+'px';psub.style.color=o.subtitle_color;psub.style.fontFamily=`"${o.subtitle_font}",sans-serif`;
  psub.style.textShadow=`0 0 ${Math.max(2,3*m)}px ${o.subtitle_outline_color},0 0 ${Math.max(2,3*m)}px ${o.subtitle_outline_color},1px 1px 2px ${o.subtitle_outline_color}`;
  psub.style.bottom=((o.subtitle_margin_v!=null&&o.subtitle_margin_v!==''?o.subtitle_margin_v:(sh>sw?260:70))*m)+'px';
  const k=sw/out,mg=o.logo_margin*k;plogo.style.width=(sw*o.logo_width_pct)+'px';plogo.style.opacity=o.logo_opacity;
  Object.assign(plogo.style,{top:'',bottom:'',left:'',right:''});
  plogo.style[o.logo_position.startsWith('top')?'top':'bottom']=mg+'px';plogo.style[o.logo_position.endsWith('left')?'left':'right']=mg+'px';
  plogo.style.display=(S.logo&&S.mode==='live')?'block':'none';
}
function resetStage(){
  const e=$('#pempty');
  if(!S.pid){e.style.display='flex';e.innerHTML='Tạo hoặc chọn một dự án ở menu bên trái để bắt đầu.';return}
  if(S.mode==='export'){e.style.display='none';return}
  if(!S.plan){e.style.display='flex';e.innerHTML='Chưa có bản dựng.<br>Thêm footage + voice-over rồi bấm <b>⚡ Tự động tạo video</b>.';return}
  e.style.display='none';
}
function findClip(t){
  const c=S.clips;let lo=0,hi=c.length-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(t<c[m].t0)hi=m-1;else if(t>=c[m].t1)lo=m+1;else return m}
  return c.length&&t>=c[c.length-1].t1?c.length-1:-1;
}
function cssFilter(v){
  const f=[];if(v.filter&&CSS_FILTER[v.filter])f.push(CSS_FILTER[v.filter]);
  f.push(`brightness(${v.brightness??1}) contrast(${v.contrast??1}) saturate(${v.saturation??1})`);return f.join(' ');
}
function showFrame(c,t){
  pv.pause();pv.style.visibility='hidden';pimg.style.display='block';
  const u=`/api/projects/${S.pid}/frame?footage=${encodeURIComponent(c.v.footage)}&t=${(+c.v.start+(t-c.t0)*(c.v.speed||1)).toFixed(1)}`;
  if(pimg.getAttribute('src')!==u)pimg.setAttribute('src',u);
  pimg.style.transform=pv.style.transform;pimg.style.filter=pv.style.filter;
}
function enterClip(ci,t){
  curClip=ci;
  if(ci<0){pv.pause();pv.style.visibility='hidden';pimg.style.display='none';return}
  const c=S.clips[ci],a=fa(c.v.footage);pv.style.filter=cssFilter(c.v);
  if(!a){showFrame(c,t);return}
  const src=`/api/assets/${a.id}/file`;
  if(S.badSrc[src]){showFrame(c,t);return}
  pimg.style.display='none';pv.style.visibility='visible';pv.muted=true;
  const want=c.v.start+(t-c.t0)*(c.v.speed||1),rate=c.v.speed||1;
  const go=()=>{try{pv.currentTime=want;pv.playbackRate=rate}catch{}if(S.playing)pv.play().catch(()=>{})};
  if(curSrc!==src){curSrc=src;pv.onloadedmetadata=go;pv.src=src}else go();
}
pv.addEventListener('error',()=>{
  if(S.mode!=='live'||curClip<0||!curSrc)return;
  S.badSrc[curSrc]=true;toast('Trình duyệt không phát được định dạng footage này, dùng ảnh tĩnh để xem trước.','err');
  curSrc='';enterClip(curClip,nowT());
});
function tick(force){
  if(!S.pid)return;
  const t=nowT();
  if(S.mode==='export'){setPlayhead(t);updTime(t);return}
  const ci=findClip(t);
  if(ci!==curClip||force)enterClip(ci,t);
  if(ci>=0){
    const c=S.clips[ci],f=Math.min(Math.max((t-c.t0)/Math.max(c.t1-c.t0,.001),0),1),z=(c.v.zoom_start||1)+((c.v.zoom_end||1)-(c.v.zoom_start||1))*f;
    pv.style.transform=pimg.style.transform=`scale(${z})`;
    const want=c.v.start+(t-c.t0)*(c.v.speed||1);
    if(pv.style.visibility==='visible'&&pv.readyState>1&&Math.abs(pv.currentTime-want)>0.6)pv.currentTime=want;
  }
  const cue=S.opts.burn_subtitles?curCue(t):null;psub.textContent=cue?cue.text:'';
  setPlayhead(t);updTime(t);
  if(S.playing&&!S.voice&&t>=S.T)pause();
}
function updTime(t){$('#tcur').textContent=`${fmt1(t)} / ${fmt1(S.T)}`;if(S.T>0)$('#scrub').value=Math.round(1000*t/S.T)}
function updTransport(){
  $('#bPlay').textContent=S.playing?'⏸':'▶';
  $('#mLive').classList.toggle('on',S.mode==='live');$('#mExp').classList.toggle('on',S.mode==='export');$('#mExp').disabled=!S.exportUrl;
}
function loop(){cancelAnimationFrame(raf);const f=()=>{if(!S.playing)return;tick(false);raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
function play(){
  if(!S.pid)return;
  if(S.mode==='export'){if(!pv.src)return;pv.play().catch(()=>{})}
  else{
    if(!S.clips.length&&!S.voice)return;
    if(S.voice)pa.play().catch(()=>{});
    clockStart=performance.now();clockOn=true;
    if(curClip>=0&&pv.style.visibility==='visible')pv.play().catch(()=>{});
  }
  S.playing=true;updTransport();loop();
}
function pause(){
  const t=nowT();pv.pause();pa.pause();clockBase=t;clockOn=false;S.playing=false;updTransport();
}
function seek(t){
  t=Math.max(0,Math.min(t,S.T||0));
  if(S.mode==='export'){pv.currentTime=t}else{if(S.voice)pa.currentTime=t;clockBase=t;clockStart=performance.now()}
  tick(true);
}
function setMode(m){
  if(m===S.mode)return;
  if(m==='export'&&!S.exportUrl){toast('Chưa có video đã xuất. Hãy xuất video trước.','err');return}
  pause();S.mode=m;
  if(m==='export'){
    pv.onloadedmetadata=null;pv.style.transform='';pv.style.filter='';pv.style.visibility='visible';pv.muted=false;pimg.style.display='none';psub.textContent='';
    pv.src=S.exportUrl;curSrc='';pv.playbackRate=1;S.T=pv.duration||S.T;pv.onended=pause;
    pv.onloadedmetadata=()=>{S.T=pv.duration||S.T;renderTimeline()};
  }else{pv.onended=null;pv.muted=true;pv.removeAttribute('src');pv.load();curSrc='';curClip=-2;buildClips();clockBase=0;if(S.voice)pa.currentTime=0}
  applyOptsToStage();resetStage();updTransport();renderTimeline();tick(true);
}
pa.onended=pause;
$('#scrub').addEventListener('input',e=>seek(S.T*e.target.value/1000));

/* ================= Hành động ================= */
async function savePlan(){
  try{
    const r=await api(`${planUrl()}/${S.planRow.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:S.plan})});
    await loadPlans(true);renderAll();
    if(r.repairs&&r.repairs.length)toast(`Đã tự điều chỉnh ${r.repairs.length} chỗ để khớp lời`,'ok');
    if(r.validation_status!=='valid')toast('Còn lỗi: '+(r.validation_errors||[]).slice(0,2).join(' | '),'err');else toast('Đã lưu và kiểm tra hợp lệ','ok');
  }catch(e){toast(e.message,'err')}
}
async function runBusy(fn,msg){try{await fn();S.wasBusy=true;if(msg)toast(msg);await loadProject();renderLeft()}catch(e){toast(e.message,'err')}}
async function openSceneDlg(){
  const x=selVis();if(!x)return;
  const foot=S.assets.filter(a=>['footage','broll'].includes(a.asset_type));
  $('#sdFoot').innerHTML=foot.map(a=>`<option value="${a.id}" ${a.file_name===x.v.footage?'selected':''}>${esc(a.file_name)}</option>`).join('');
  $('#sceneDlg').showModal();await loadSceneGrid();
}
async function loadSceneGrid(){
  const id=$('#sdFoot').value,a=S.assets.find(z=>z.id===id);if(!a)return;
  try{S.scenes=await api(`/assets/${id}/scenes`)}catch(e){toast(e.message,'err');return}
  $('#sdGrid').innerHTML=S.scenes.length?S.scenes.slice(0,150).map((s,i)=>`<div data-act="useScene" data-i="${i}"><img loading="lazy" src="/api/projects/${S.pid}/frame?footage=${encodeURIComponent(a.file_name)}&t=${((s.start+s.end)/2).toFixed(1)}" alt=""><span>${fmt(s.start)}–${fmt(s.end)}${s.shot_type?' · '+esc(s.shot_type):''}</span></div>`).join(''):'<p class="mut">Chưa có cảnh. Hãy bấm “Phân tích cảnh phim” ở menu Tài nguyên.</p>';
}
$('#sdFoot').onchange=loadSceneGrid;
function swapClips(i,j){
  if(i===j||!S.clips[i]||!S.clips[j])return;
  const a=S.clips[i],b=S.clips[j],sa=S.plan.sections[a.k],sb=S.plan.sections[b.k],tmp=sa.visuals[a.j];
  sa.visuals[a.j]=sb.visuals[b.j];sb.visuals[b.j]=tmp;S.sel={k:b.k,j:b.j};markDirty();
}

let optsTimer=0;
function saveOptsSoon(){
  clearTimeout(optsTimer);
  optsTimer=setTimeout(async()=>{if(!S.pid||!S.project)return;try{const st={...(S.project.settings||{}),render_opts:S.opts};S.project=await api('/projects/'+S.pid,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings:st})})}catch{}},700);
}
const STR_CLIP=['footage','filter','transition_in','transition_out','purpose'];
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.clip!==undefined){
    const x=selVis();if(!x)return;const k=t.dataset.clip;let val=t.value;
    if(!STR_CLIP.includes(k)){val=parseFloat(val);if(isNaN(val))return}
    if(k==='purpose')x.s.purpose=val;else if(k==='filter')x.v.filter=val||null;else x.v[k]=val;
    if(t.nextElementSibling&&t.nextElementSibling.tagName==='OUTPUT')t.nextElementSibling.textContent=(+val).toFixed(2);
    S.dirty=true;buildClips();renderTimeline();tick(true);
    updDirty();
  }else if(t.dataset.opt!==undefined){
    const k=t.dataset.opt;let val;
    if(t.type==='checkbox')val=k==='hw_accel'?(t.checked?'auto':'off'):t.checked;
    else if(t.type==='range'||t.type==='number'){val=t.value===''?null:parseFloat(t.value);if(val!==null&&t.dataset.div)val/=+t.dataset.div;if(k==='fps'&&val!==null)val=Math.round(val)}
    else val=t.value;
    if(k==='fps')val=parseInt(t.value,10);
    S.opts[k]=val;
    if(t.nextElementSibling&&t.nextElementSibling.tagName==='OUTPUT')t.nextElementSibling.textContent=t.dataset.div?Math.round(val*100):val;
    saveOptsSoon();applyOptsToStage();
    if(k==='aspect_ratio')fitStage();if(k==='music_volume')renderTimeline();tick(true);
  }else if(t.dataset.v!==undefined){
    S.v[t.dataset.v]=t.type==='number'?parseFloat(t.value):t.value;
    if(t.dataset.v==='prov'){S.voiceList=[];S.v.voice='';loadVoices(true)}else updVInfo();
  }else if(t.id==='vText')updVInfo();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.cue!==undefined){
    const f=t.dataset.f,v=f==='text'?t.value:parseFloat(t.value);
    try{await send('PATCH',`/projects/${S.pid}/srt/cues/${t.dataset.cue}`,{[f]:v});await loadCues();renderTimeline()}catch(err){toast(err.message,'err');await loadCues();renderLeft()}
  }else if(t.dataset.cuetext!==undefined){
    try{await send('PATCH',`/projects/${S.pid}/srt/cues/${t.dataset.cuetext}`,{text:t.value});await loadCues();renderTimeline();tick(true);toast('Đã lưu phụ đề','ok')}catch(err){toast(err.message,'err')}
  }else if(t.dataset.connActive!==undefined){
    try{await api('/connections/active',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:t.dataset.svc,id:t.dataset.connActive})});await loadConns();toast('Đã chọn nguồn đang dùng','ok')}catch(err){toast(err.message,'err')}
  }else if(t.dataset.connEnabled!==undefined){
    try{await send('POST','/connections',{service:t.dataset.svc,id:t.dataset.connEnabled,enabled:t.checked,force:true,set_active:false});await loadConns();lSettings()}catch(err){toast(err.message,'err')}
  }else if(t.id==='autoFillChk'){
    try{S.project=await api('/projects/'+S.pid,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings:{...(S.project.settings||{}),autofill:t.checked}})});toast(t.checked?'Sẽ tự bổ sung bằng AI khi thêm file':'Đã tắt tự bổ sung','ok')}catch(err){toast(err.message,'err')}
  }else if(t.id==='perfMode'){
    try{S.hw=await send('PUT','/system/perf',{mode:t.value});lSettings();pollSys();toast('Đã đổi chế độ hiệu năng','ok')}catch(err){toast(err.message,'err')}
  }else if(t.id==='updSrc'||t.id==='updAuto'){
    try{const r=await send('PUT','/system/update/config',t.id==='updSrc'?{source:t.value}:{auto_check:t.checked});S.upd={...r,download:(S.upd||{}).download};lSettings();
      const b=$('#updBadge');if(b){b.hidden=!r.available;b.textContent='⬆ Cập nhật v'+(r.latest||'')}
      toast(r.error?r.error:(t.id==='updSrc'?'Đã lưu nguồn cập nhật':'Đã lưu'),r.error?'err':'ok')}catch(err){toast(err.message,'err')}
  }else if(t.id==='cacheLimit'){
    try{S.storage=await send('PUT','/storage/limit',{cache_limit_gb:+t.value});lSettings();toast('Đã đặt giới hạn bộ nhớ đệm','ok')}catch(err){toast(err.message,'err')}
  }else if(t.dataset.actChange==='version'){
    try{S.planRow=await api(`${planUrl()}/${t.value}`);S.plan=clone(S.planRow.plan);S.dirty=false;buildClips();renderAll()}catch(err){toast(err.message,'err')}
  }
});

/* ----- kéo thả đổi chỗ clip ----- */
document.addEventListener('dragstart',e=>{const b=e.target.closest&&e.target.closest('[data-clip-i]');if(b){S.drag=+b.dataset.clipI;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','clip')}});
document.addEventListener('dragover',e=>{if(S.drag!=null&&e.target.closest&&e.target.closest('[data-clip-i]'))e.preventDefault()});
document.addEventListener('drop',e=>{const b=e.target.closest&&e.target.closest('[data-clip-i]');if(S.drag!=null&&b){e.preventDefault();swapClips(S.drag,+b.dataset.clipI)}S.drag=null});
document.addEventListener('dragend',()=>{S.drag=null});

/* ----- phím tắt ----- */
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,textarea,select'))return;
  if(e.code==='Space'){e.preventDefault();ACT.play()}
  else if(e.code==='ArrowLeft')seek(nowT()-1);else if(e.code==='ArrowRight')seek(nowT()+1);
});
window.addEventListener('resize',fitStage);

/* ----- dán API key là tự kết nối (không cần bấm nút) ----- */
let autoConnT=null;
function autoConnect(delay){
  clearTimeout(autoConnT);
  if(!S.connForm)return;
  const k=($('#cKey')||{}).value||'',t=$('#t-'+S.connForm.svc);
  if(k.trim().length<8){if(t&&!S.connForm.id){t.style.color='';t.textContent=k.trim()?'Tiếp tục dán API key…':''}return}
  const bad=keyProblem(k.trim(),(($('#cUrl')||{}).value||'').trim());
  if(bad){if(t){t.textContent='✗ '+bad;t.style.color='var(--er)'}return}
  if(t){t.style.color='';t.textContent='Sẽ tự kết nối…'}
  autoConnT=setTimeout(()=>{const b=document.querySelector('[data-act="saveConn"]');if(b)ACT.saveConn(b)},delay);
}
document.addEventListener('input',e=>{if(['cKey','cUrl','cProto'].includes(e.target.id))autoConnect(e.target.id==='cKey'?700:1200)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['cKey','cUrl','cName','cModel','cFast','cUa'].includes(e.target.id)){e.preventDefault();autoConnect(0)}});
boot();
</script>
